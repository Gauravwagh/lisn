<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 300px; margin: 0; padding: 12px; color: #222; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      label { display: block; margin-top: 8px; font-weight: 600; }
      input, select { width: 100%; box-sizing: border-box; padding: 5px; margin-top: 3px; }
      button { margin-top: 10px; padding: 7px 10px; border: 0; border-radius: 6px; background: #3b5bdb; color: #fff; cursor: pointer; }
      button.secondary { background: #666; }
      .row { display: flex; gap: 8px; }
      #status { margin-top: 10px; padding: 6px; border-radius: 6px; background: #f1f3f5; }
      #status.ok { background: #e6fcf5; }
      #status.bad { background: #fff4e6; }
      small { color: #666; display: block; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>lisn</h1>
    <div class="row">
      <button id="read-page">Read this page</button>
      <button id="read-selection" class="secondary">Read selection</button>
    </div>
    <div id="status">checking server…</div>
    <label>Server port <input id="port" type="number" min="1" max="65535" /></label>
    <label>Token <input id="token" type="password" placeholder="lisn serve --show-token" /></label>
    <label>Speed <input id="speed" type="number" min="0.5" max="3" step="0.1" /></label>
    <label>Voice <select id="voice"><option value="">(server default)</option></select></label>
    <button id="save" class="secondary">Save settings</button>
    <small>Run <code>lisn serve</code> in a terminal. Without it, the browser's own voice is used.</small>
    <script src="popup.js"></script>
  </body>
</html>
